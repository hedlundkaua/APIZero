spring.application.name=Zero

# Configuração BD PostgreSQL (Docker)
spring.datasource.url=jdbc:postgresql://localhost:5433/apizero_db
spring.datasource.username=zero
spring.datasource.password=zeropassword
spring.datasource.driver-class-name=org.postgresql.Driver

# Logs do Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# O Hibernate deixa de criar as tabelas e passa apenas a validar
spring.jpa.hibernate.ddl-auto=none

# O Flyway assume o controlo absoluto
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
