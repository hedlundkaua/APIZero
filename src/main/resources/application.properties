spring.application.name=Zero

#configuração BD H2
spring.datasource.url=jdbc:h2:mem:apizero_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

#habilita o console H2 no navegador (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

#Mostra as queries SQL que o Hibernate (JPA) está fazendo por baixo dos panos
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Como não temos o flyway, o JPA cria as tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update